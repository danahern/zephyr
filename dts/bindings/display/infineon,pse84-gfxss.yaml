description: |
  Infineon PSE84 GFXSS (Graphics Subsystem) display controller.

  The GFXSS bundles a Vivante DCNano display controller, a MIPI DSI host
  (Synopsys DWC), and an optional GPU into one IP block at 0x44800000.
  The framebuffer is backed by SOCMEM (DC reads via a dedicated DMA port,
  not from main SRAM).

  This driver wraps the Cypress HAL (Cy_GFXSS_Init) and exposes the standard
  Zephyr display_driver_api. It operates the DSI link in VIDEO mode: after
  initialization the DC autonomously scans the framebuffer. Software writes
  pixels into the FB via display_write() and a D-cache clean ensures the DC
  sees the update on the next vsync.

  The DSI D-PHY PLL reference is CLK_HF12. The driver expects the board DT
  to have already routed a suitable clock into HF12 (e.g. via clk_ext →
  path_mux4 → clk_hf12 on the KIT_PSE84_EVAL, which wires a 24 MHz external
  clock to P7[4]/srss.ext_clk). It fails fast if HF12 reads 0 Hz at init.

compatible: "infineon,pse84-gfxss"

include: [lcd-controller.yaml]

properties:
  reg:
    required: true

  framebuffer:
    type: phandle
    required: true
    description: |
      Phandle to a memory node describing where the framebuffer lives
      in SOCMEM. The referenced node must have a 'reg' property whose
      size is at least stride_pixels * height * bytes_per_pixel (see
      'stride-pixels'). The driver reads the address and size via
      DT_REG_ADDR / DT_REG_SIZE and writes pixels there directly; the
      node does not need to be a zephyr,memory-region because the CM55
      linker does not own SOCMEM.

  stride-pixels:
    type: int
    description: |
      Row stride of the framebuffer in pixels. If unset, defaults to 'width'.
      On PSE84 the DC requires the row stride in bytes to be 128-byte
      aligned, so panels whose width does not satisfy that constraint need
      stride-pixels > width. For example, an RGB565 800-pixel-wide panel
      needs stride-pixels = 832 (832*2 = 1664 = 13*128). The tail pixels
      in each row are included in the DSI hactive so the DSI-to-RGB bridge
      on the panel can fetch them; the bridge itself is responsible for
      cropping to the physical display width.

  num-lanes:
    type: int
    required: true
    description: Number of MIPI DSI data lanes (1 for the Waveshare 4.3").

  per-lane-mbps:
    type: int
    required: true
    description: Per-lane DSI line rate in megabits per second (810 for 4.3").

  pixel-clock-khz:
    type: int
    required: true
    description: |
      DPI pixel clock in kHz. Computed as
        (hsync_width + hfp + hbp + width) *
        (vsync_width + vfp + vbp + height) * fps / 1000

  hsync-width:
    type: int
    required: true

  hfp:
    type: int
    required: true
    description: Horizontal front porch in pixel clocks.

  hbp:
    type: int
    required: true
    description: Horizontal back porch in pixel clocks.

  vsync-width:
    type: int
    required: true

  vfp:
    type: int
    required: true
    description: Vertical front porch in lines.

  vbp:
    type: int
    required: true
    description: Vertical back porch in lines.

# Panel association is resolved at compile time via DEVICE_DT_GET_ANY()
# on a known panel compatible (e.g. waveshare,dsi-4p3-mcu), not by a
# phandle property, so the EDT init priority validator does not see a
# dependency from this node to the panel. This lets the panel be marked
# 'zephyr,deferred-init' (required for panels whose control interface
# only responds after the DSI link is already transmitting) without
# blocking GFXSS bring-up.
