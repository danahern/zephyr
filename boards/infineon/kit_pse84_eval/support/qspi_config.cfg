# SMIF bank layout for kit_pse84_eval.
#
# Slot 1: S25FS128S Quad 16 MB on CS1 (default, matches the stock FLM).
# Slot 0: S28HS01GT Octal 64 MB on CS0 (only active when flashing with
#         a CONFIG_INFINEON_SMIF_OCTAL=y image — requires pointing
#         QSPI_FLASHLOADER at a QSPI-Configurator-patched PSE84_SMIF.FLM
#         instead of the stock ../flm/infineon/pse8xxgp/PSE84_SMIF.FLM.
#         See Cyp PSE84_OCTAL_FLASH_ENABLEMENT_PLAN.md.)
#
# Boards using CONFIG_INFINEON_SMIF_OCTAL should set the SMIF_OCTAL env
# variable before invoking west flash (e.g. via board.cmake runner
# setup), which causes this script to declare Slot 0 instead of Slot 1.

if {[info exists ::env(SMIF_OCTAL)] && $::env(SMIF_OCTAL) == "1"} {
	set SMIF_BANKS {
		0 {addr 0x60000000 size 0x4000000 psize 0x0000100 esize 0x0040000}
	}
} else {
	set SMIF_BANKS {
		1 {addr 0x60000000 size 0x1000000 psize 0x0000100 esize 0x0010000}
	}
}
