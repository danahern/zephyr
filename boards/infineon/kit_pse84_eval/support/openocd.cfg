set ENABLE_CM55 1
set ENABLE_CM33 1

source [find interface/kitprog3.cfg]
transport select swd

if { [info exists _ZEPHYR_BOARD_SERIAL] } {
	adapter serial $_ZEPHYR_BOARD_SERIAL
}

if { [info exists WEST_ATTACH] } {
	set ENABLE_ACQUIRE 0
}

# When SMIF_OCTAL_FLM is set in the environment, point QSPI_FLASHLOADER
# at a QSPI-Configurator-patched PSE84_SMIF.FLM (generated by running the
# ModusToolbox qspi-configurator-cli with the "Octal DDR Hybrid at Bottom
# 25 MHz" preset on Slot 0). The patched FLM knows how to talk to the
# S28HS01GT Octal chip on CS0; the stock FLM only understands the Quad
# S25FS128S on CS1. SMIF_OCTAL_FLM must be an absolute path to the FLM
# file (the cat1d base script will source it via the QSPI_FLASHLOADER
# global). Typically used together with SMIF_OCTAL=1 for qspi_config.cfg.
if {[info exists ::env(SMIF_OCTAL_FLM)]} {
	set QSPI_FLASHLOADER $::env(SMIF_OCTAL_FLM)
	puts "SMIF_OCTAL_FLM: using patched QSPI flashloader $QSPI_FLASHLOADER"
}

source [find target/infineon/pse84xgxs2.cfg]
cat1d.cm55 configure -rtos auto -rtos-wipe-on-reset-halt 1
cat1d.cm33 configure -rtos auto -rtos-wipe-on-reset-halt 1
gdb_breakpoint_override hard

if { [info exists WEST_ATTACH] } {
	set _RESET 0
} else {
	set _RESET 1
}

if {$_RESET} {
	cat1d.cm55 configure -event gdb-attach {
		reset_halt cm55
	}

	cat1d.cm33 configure -event gdb-attach {
		cat1d.cm33 cortex_m vector_catch reset
		reset run
		cat1d.cm33 arp_waitstate halted 8000
		cat1d.cm33 cortex_m vector_catch none
	}
}
